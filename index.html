    <script>
      (() => {
        const siteUrl = "https://www.riasboutique.com";
        const collectionDepartments = new Set(["women", "men", "jewelry"]);
        const searchParams = new URLSearchParams(window.location.search);
        const queryDepartment = (searchParams.get("department") || "").trim().toLowerCase();
        const pathname = window.location.pathname || "/";
        const normalizedPath =
          pathname.length > 1 && pathname.endsWith("/") ? pathname.slice(0, -1) : pathname;

        let canonicalPath = normalizedPath || "/";
        if (canonicalPath === "/collection" && collectionDepartments.has(queryDepartment)) {
          canonicalPath = `/collection/${queryDepartment}`;
        } else if (canonicalPath.startsWith("/collection/")) {
          const routeDepartment = canonicalPath.split("/")[2]?.trim().toLowerCase() || "";
          if (!collectionDepartments.has(routeDepartment)) {
            canonicalPath = "/collection";
          } else {
            canonicalPath = `/collection/${routeDepartment}`;
          }
        }

        const canonicalUrl =
          canonicalPath === "/" ? `${siteUrl}/` : `${siteUrl}${canonicalPath}`;

        const canonicalLink = document.getElementById("rb-canonical");
        const alternateEnCaLink = document.getElementById("rb-alternate-en-ca");
        const alternateDefaultLink = document.getElementById("rb-alternate-x-default");
        const ogUrlTag = document.getElementById("rb-og-url");

        if (canonicalLink) canonicalLink.setAttribute("href", canonicalUrl);
        if (alternateEnCaLink) alternateEnCaLink.setAttribute("href", canonicalUrl);
        if (alternateDefaultLink) alternateDefaultLink.setAttribute("href", canonicalUrl);
        if (ogUrlTag) ogUrlTag.setAttribute("content", canonicalUrl);
      })();
    </script>
