backend:
  name: github
  repo: Ali-Akbari1/Rias-Boutique1
  branch: main
  base_url: https://www.riasboutique.com
  auth_endpoint: api/auth

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: "store"
    label: "Store Content"
    files:
      - label: "Products"
        name: "products"
        file: "src/content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Unique number/string like 7 or afghan-blue-1" }
              - { label: "Slug", name: "slug", widget: "string", hint: "URL-safe text, e.g. emerald-zarbaft-gown" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (CAD)", name: "price", widget: "number", value_type: "int", min: 1 }
              - label: "Department"
                name: "department"
                widget: "select"
                required: false
                default: "women"
                options:
                  - { label: "Women", value: "women" }
                  - { label: "Men", value: "men" }
                  - { label: "Jewelry", value: "jewelry" }
              - {
                  label: "Sale Percent Off (optional)",
                  name: "salePercent",
                  widget: "number",
                  value_type: "int",
                  min: 1,
                  max: 90,
                  required: false
                }
              - {
                  label: "Original Price / Compare At (CAD, optional)",
                  name: "compareAtPrice",
                  widget: "number",
                  value_type: "float",
                  min: 1,
                  required: false
                }
              - label: "Inventory Status"
                name: "inventory"
                widget: "select"
                required: false
                default: "available"
                options:
                  - { label: "Available", value: "available" }
                  - { label: "Sold Out", value: "sold_out" }
              - {
                  label: "Category",
                  name: "category",
                  widget: "select",
                  options: ["Party Wear", "Bridal", "Formal", "Handmade", "Machine Made", "Artificial", "925 Silver"]
                }
              - { label: "Main Image", name: "image", widget: "image", choose_url: false }
              - label: "Gallery Images"
                name: "galleryImages"
                widget: "list"
                required: false
                field: { label: "Image", name: "image", widget: "image", choose_url: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Available Sizes"
                name: "sizes"
                widget: "list"
                required: false
                field:
                  label: "Size"
                  name: "size"
                  widget: "select"
                  options:
                    - "Small"
                    - "Medium"
                    - "Large"
                    - "X-Large"
                    - "XX-Large"
              - label: "Available Colors"
                name: "colors"
                widget: "list"
                required: false
                field: { label: "Color", name: "color", widget: "string" }
              - { label: "Fabric", name: "fabric", widget: "text", required: false }
              - { label: "Fit Information", name: "fitInfo", widget: "text", required: false }
              - label: "Care Instructions"
                name: "careInstructions"
                widget: "list"
                required: false
                field: { label: "Instruction", name: "instruction", widget: "string" }
              - { label: "Delivery Estimate", name: "deliveryEstimate", widget: "string", required: false }
              - { label: "Popularity (0-100)", name: "popularity", widget: "number", value_type: "int", min: 0, max: 100, required: false }
              - { label: "Created Date", name: "createdAt", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
