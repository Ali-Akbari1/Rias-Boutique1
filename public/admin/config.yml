backend:
  name: github
  repo: Ali-Akbari1/Rias-Boutique1
  branch: main
  base_url: https://www.riasboutique.com
  auth_endpoint: api/auth

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: "store"
    label: "Store Content"
    files:
      - label: "Products"
        name: "products"
        file: "src/content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} ({{fields.category}})"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Unique number/string like 7 or afghan-blue-1" }
              - { label: "Slug", name: "slug", widget: "string", hint: "URL-safe text, e.g. emerald-zarbaft-gown" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (CAD)", name: "price", widget: "number", value_type: "int", min: 1 }
              - { label: "Inventory", name: "inventory", widget: "number", value_type: "int", min: 0, required: false }
              - { label: "Category", name: "category", widget: "select", options: ["Party Wear", "Bridal", "Casual"] }
              - { label: "Main Image", name: "image", widget: "image", choose_url: false }
              - label: "Gallery Images"
                name: "galleryImages"
                widget: "list"
                required: false
                field: { label: "Image", name: "image", widget: "image", choose_url: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Available Sizes"
                name: "sizes"
                widget: "list"
                required: false
                field: { label: "Size", name: "size", widget: "string" }
              - label: "Available Colors"
                name: "colors"
                widget: "list"
                required: false
                field: { label: "Color", name: "color", widget: "string" }
              - { label: "Fabric", name: "fabric", widget: "text", required: false }
              - { label: "Fit Information", name: "fitInfo", widget: "text", required: false }
              - label: "Care Instructions"
                name: "careInstructions"
                widget: "list"
                required: false
                field: { label: "Instruction", name: "instruction", widget: "string" }
              - { label: "Delivery Estimate", name: "deliveryEstimate", widget: "string", required: false }
              - { label: "Popularity (0-100)", name: "popularity", widget: "number", value_type: "int", min: 0, max: 100, required: false }
              - { label: "Created Date", name: "createdAt", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
