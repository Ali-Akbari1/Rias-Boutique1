name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck server
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
